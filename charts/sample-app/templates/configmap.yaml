apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-app.fullname" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
data:
  # 每個 key 會變成 container 的一個 environment variable（透過 envFrom）
  GREETING: {{ .Values.config.greeting | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
